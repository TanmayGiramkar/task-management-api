spring.application.name=taskapi
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb?options=-c%20TimeZone%3DAsia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# OpenAPI docs: list only the errors each endpoint declares, instead of every @ExceptionHandler on every endpoint
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json

# Access tokens (ADR 0004). JWT_SECRET lives in .env: Base64 of at least 32 random bytes.
# The empty default lets SecurityConfig fail at startup with a clear message when it is missing.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=task-management-api
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=7d

# Requests per client IP on the auth endpoints: <capacity> at once, refilled at <capacity> per <period>
app.security.rate-limit.login.capacity=5
app.security.rate-limit.login.period=1m
app.security.rate-limit.register.capacity=3
app.security.rate-limit.register.period=1m
app.security.rate-limit.refresh.capacity=10
app.security.rate-limit.refresh.period=1m
