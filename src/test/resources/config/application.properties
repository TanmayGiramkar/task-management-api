# Test-only overrides. Spring Boot loads classpath:config/application.properties after
# classpath:application.properties, so these values win in every test.

# A new random JWT signing key on every test run, so no key is ever stored in the repository.
# ${random.value} is 32 hexadecimal characters; hex digits are valid Base64, so two of them decode
# to 48 bytes, above the 32-byte minimum for HS256.
app.security.jwt.secret=${random.value}${random.value}
